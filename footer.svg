<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" rx="24" fill="#09090B"/>
  <path d="M80 90 H1120" stroke="#27272A" stroke-width="2"/>
  <circle cx="80" cy="90" r="5" fill="#7C3AED">
    <animate attributeName="cx" values="80;1120;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="78" text-anchor="middle" fill="#F4F4F5"
        font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700"
        letter-spacing="4">BUILD → BREAK → LEARN → REBUILD</text>
  <text x="600" y="115" text-anchor="middle" fill="url(#g)"
        font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
        KEEP BUILDING
  </text>
</svg>
