<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.5" stop-color="#111016"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <circle cx="980" cy="90" r="120" fill="#7C3AED" opacity=".10" filter="url(#glow)">
    <animate attributeName="r" values="105;135;105" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".06;.14;.06" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="300" r="90" fill="#22D3EE" opacity=".07" filter="url(#glow)">
    <animate attributeName="r" values="80;105;80" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="80" y="125" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="68" font-weight="800" letter-spacing="2">
    VITESH
  </text>

  <rect x="82" y="150" width="420" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;420;280;420" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="215" fill="#E4E4E7" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="600">
    AI × SOFTWARE × AUTOMATION
  </text>

  <text x="80" y="262" fill="#A1A1AA" font-family="Inter,Segoe UI,sans-serif" font-size="19">
    Building intelligent systems, practical products
  </text>
  <text x="80" y="292" fill="#A1A1AA" font-family="Inter,Segoe UI,sans-serif" font-size="19">
    and experiments that turn ideas into software.
  </text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <text x="80" y="350" fill="#8B5CF6">● AI</text>
    <text x="180" y="350" fill="#A1A1AA">● FULL STACK</text>
    <text x="340" y="350" fill="#22D3EE">● VIBE CODING</text>
    <text x="510" y="350" fill="#A1A1AA">● AUTOMATION</text>
  </g>

  <text x="80" y="385" fill="#52525B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    STATUS: BUILDING
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
